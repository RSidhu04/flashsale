spring:
  application:
    name: flashsale
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/flashsale}
    username: ${POSTGRES_USER:flashsale}
    password: ${POSTGRES_PASSWORD}
    hikari:
      maximum-pool-size: 16
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  mvc:
    problemdetails:
      enabled: true
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
server:
  address: ${SERVER_ADDRESS:127.0.0.1}
